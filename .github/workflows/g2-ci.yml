name: g2-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  g2-gate:
    name: g2-gate
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: product-test
        run: python3 -m unittest test_add.py -v

  g4-path:
    name: g4-path
    runs-on: ubuntu-latest
    steps:
      - name: path-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          echo "Changed files:"
          echo "$FILES"
          LABELS='${{ join(github.event.pull_request.labels.*.name, ',') }}'
          echo "Labels: $LABELS"
          if echo "$FILES" | grep -E '^infra/production/'; then
            echo "High-risk path changed"
            case ",$LABELS," in
              *,infra-ok,*)
                echo "g4-path PASS (infra-ok)"
                exit 0
                ;;
            esac
            echo "g4-path FAIL: infra/production changed without label infra-ok"
            exit 1
          fi
          echo "g4-path PASS (no high-risk path)"
